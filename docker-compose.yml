# =============================================================================
# Docker Compose – Snowman Enterprise Application
# =============================================================================
# Lightweight replacement for Eureka (Service-Registry) + Spring Cloud Gateway
# (API-Gateway):
#
#   * Docker Compose built-in DNS  -->  replaces Eureka service discovery
#   * Traefik reverse proxy        -->  replaces Spring Cloud Gateway
#
# Services reference each other by container name (e.g. "mysql", "activemq")
# which Docker's embedded DNS resolves automatically — no registry needed.
# =============================================================================

version: "3.9"

# ---------------------------------------------------------------------------
# Shared network – every container joins this network and is reachable by
# its service name via Docker DNS (the lightweight Eureka replacement).
# ---------------------------------------------------------------------------
networks:
  snowman-net:
    driver: bridge

# ---------------------------------------------------------------------------
# Named volumes for data persistence across container restarts.
# ---------------------------------------------------------------------------
volumes:
  mysql-data:
  activemq-data:

services:
  # -------------------------------------------------------------------------
  # Traefik – reverse proxy / API gateway  (replaces Spring Cloud Gateway)
  # -------------------------------------------------------------------------
  traefik:
    image: traefik:v2.10
    command:
      # Enable the Docker provider so Traefik auto-discovers services via
      # labels — no static route config files required.
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=snowman-net"
      # HTTP entrypoint on port 80
      - "--entrypoints.web.address=:80"
      # Dashboard (dev only – disable in production)
      - "--api.dashboard=true"
      - "--api.insecure=true"
      # Healthcheck ping
      - "--ping=true"
      - "--ping.entrypoint=web"
      # Logging
      - "--log.level=INFO"
    ports:
      - "80:80"       # Public HTTP entrypoint
      - "8080:8080"   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - snowman-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # MySQL 8 – relational database
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-snowman}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - snowman-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # ActiveMQ – JMS message broker
  # -------------------------------------------------------------------------
  activemq:
    image: rmohr/activemq:5.15.9-alpine
    ports:
      - "61616:61616"   # OpenWire (JMS)
      - "8161:8161"     # Web console
    volumes:
      - activemq-data:/opt/activemq/data
    networks:
      - snowman-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8161/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Snowman application
  # -------------------------------------------------------------------------
  # Docker Compose DNS resolves "mysql" and "activemq" automatically —
  # no Eureka client or service-registry required.
  # Traefik picks up routing rules from the labels below — no Spring Cloud
  # Gateway config required.
  # -------------------------------------------------------------------------
  snowman-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_PORT: "8090"
      JDBC_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-snowman}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      JDBC_USERNAME: ${MYSQL_USER}
      JDBC_PASSWORD: ${MYSQL_PASSWORD}
      JMS_BROKER_URL: "tcp://activemq:61616"
      HIBERNATE_DDL_AUTO: "update"
      JAVA_OPTS: "-Xms256m -Xmx512m"
    labels:
      # --- Traefik routing (replaces Spring Cloud Gateway routes) ----------
      - "traefik.enable=true"
      # Route: all traffic on the "web" entrypoint with PathPrefix /api
      - "traefik.http.routers.snowman-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.snowman-api.entrypoints=web"
      # Strip /api prefix before forwarding to the app
      - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      - "traefik.http.routers.snowman-api.middlewares=strip-api"
      # Route: catch-all for direct access (e.g. /employee, /user, etc.)
      - "traefik.http.routers.snowman-direct.rule=PathPrefix(`/`)"
      - "traefik.http.routers.snowman-direct.entrypoints=web"
      - "traefik.http.routers.snowman-direct.priority=1"
      # Tell Traefik which port the container listens on
      - "traefik.http.services.snowman-app.loadbalancer.server.port=8090"
    depends_on:
      mysql:
        condition: service_healthy
      activemq:
        condition: service_healthy
    networks:
      - snowman-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    # Scale horizontally — Docker DNS load-balances across replicas
    # (no Eureka needed for instance registration).
    # Usage: docker compose up --scale snowman-app=3
