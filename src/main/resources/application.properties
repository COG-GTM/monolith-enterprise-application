# jdbc.X
jdbc.driverClassName=com.mysql.jdbc.Driver
# Credentials are never committed: supply them via the environment (or -Djdbc.username / -Djdbc.password).
jdbc.url=${SNOWMAN_DB_URL:jdbc:mysql://localhost:3306/snowman?createDatabaseIfNotExist=true}
jdbc.username=${SNOWMAN_DB_USERNAME}
jdbc.password=${SNOWMAN_DB_PASSWORD}

# hibernate.X
hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
hibernate.show_sql=true
# validate | update | create | create-drop
hibernate.hbm2ddl.auto=validate

# Messaging - JMS
jms.brokerUrl=tcp://localhost:61616
