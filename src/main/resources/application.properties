# jdbc.X
jdbc.driverClassName=com.mysql.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/snowman?createDatabaseIfNotExist=true
jdbc.username=username
jdbc.password=password

# hibernate.X
hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
hibernate.show_sql=true
# validate | update | create | create-drop
hibernate.hbm2ddl.auto=validate

# Messaging - JMS
jms.brokerUrl=tcp://localhost:61616

# Administrator for the /user endpoints (HTTP Basic). Leave unset here and supply via
# SNOWMAN_ADMIN_USERNAME / SNOWMAN_ADMIN_PASSWORD_HASH (or -Dsnowman.admin.username / -Dsnowman.admin.password.hash).
# Generate the hash with:
#   java -cp <jar> com.mycompany.entapp.snowman.infrastructure.security.PasswordHasher
# When unset, every /user request is rejected with 401.
