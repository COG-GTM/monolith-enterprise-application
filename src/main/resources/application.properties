# jdbc.X
jdbc.driverClassName=com.mysql.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/snowman?createDatabaseIfNotExist=true
jdbc.username=username
jdbc.password=password

# hibernate.X
hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
hibernate.show_sql=true
# validate | update | create | create-drop
hibernate.hbm2ddl.auto=validate

# Messaging - JMS
jms.brokerUrl=tcp://localhost:61616

# API security (HTTP Basic). Never commit real values: set them as environment variables
# (e.g. SNOWMAN_SECURITY_ADMIN_USERNAME / SNOWMAN_SECURITY_ADMIN_PASSWORD) or -D system properties.
# Accounts left blank are disabled; with none configured, role-protected endpoints reject every request.
# snowman.security.admin.username=
# snowman.security.admin.password=
# snowman.security.viewer.username=
# snowman.security.viewer.password=
