# jdbc.X
jdbc.driverClassName=com.mysql.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/snowman?createDatabaseIfNotExist=true
jdbc.username=${DB_USERNAME}
jdbc.password=${DB_PASSWORD}

# hibernate.X
hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
hibernate.show_sql=true
# validate | update | create | create-drop
hibernate.hbm2ddl.auto=validate

# Messaging - JMS
# TLS-secured broker connection (VULN-03, CWE-319) - ActiveMQ broker must be configured with TLS certificates
jms.brokerUrl=ssl://localhost:61617
jms.username=${JMS_USERNAME}
jms.password=${JMS_PASSWORD}

# External service URLs
client.system.url=${CLIENT_SYSTEM_URL:https://localhost:8443/client-system/client/{clientId}/projects}
