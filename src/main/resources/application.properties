# jdbc.X
jdbc.driverClassName=com.mysql.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/snowman?createDatabaseIfNotExist=true
jdbc.username=username
jdbc.password=password
# connection pool (c3p0) - keep maxSize well below MySQL max_connections
jdbc.pool.minSize=2
jdbc.pool.maxSize=20
jdbc.pool.checkoutTimeoutMillis=5000
jdbc.pool.maxIdleTimeSeconds=300
jdbc.pool.idleTestPeriodSeconds=60

# health.X - /health reuses the last DB probe result for this long
health.db.cacheTtlMillis=5000
health.db.queryTimeoutSeconds=2

# hibernate.X
hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
hibernate.show_sql=true
# validate | update | create | create-drop
hibernate.hbm2ddl.auto=validate

# Messaging - JMS
jms.brokerUrl=tcp://localhost:61616
