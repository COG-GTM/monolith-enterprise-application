# jdbc.X
# When running inside Docker Compose the service name "mysql" is resolved via
# the built-in DNS (replaces the need for Eureka service-registry).
jdbc.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.url=${JDBC_URL:jdbc:mysql://localhost:3306/snowman?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
jdbc.username=${JDBC_USERNAME:username}
jdbc.password=${JDBC_PASSWORD:password}

# hibernate.X
hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
hibernate.show_sql=true
# validate | update | create | create-drop
hibernate.hbm2ddl.auto=${HIBERNATE_DDL_AUTO:validate}

# Messaging - JMS
# When running inside Docker Compose the service name "activemq" is resolved
# via the built-in DNS (replaces the need for Eureka service-registry).
jms.brokerUrl=${JMS_BROKER_URL:tcp://localhost:61616}
